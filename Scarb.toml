[package]
name = "pavilion_exchange"
version = "1.0.0"
edition = "2024_07"
license = "MIT"
description = "Pavilion Market v1 exchange"

[dependencies]
starknet = "2.20.0"
openzeppelin_access = "4.0.1"
openzeppelin_security = "4.0.1"
openzeppelin_utils = "2.2.0"
openzeppelin_interfaces = "2.2.0"

[dev-dependencies]
snforge_std = "0.64.1"
assert_macros = "2.20.0"
openzeppelin_token = "4.0.1"
openzeppelin_account = "4.0.1"
openzeppelin_introspection = "4.0.1"

[[target.starknet-contract]]
sierra = true

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]
